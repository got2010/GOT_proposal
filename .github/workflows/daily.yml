name: daily-collect

on:
  schedule:
    - cron: "0 22 * * *" # 日本時間 毎朝7時（遅延する場合があります）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-private-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 非公開設定を確認
        if: ${{ github.event.repository.private != true }}
        run: |
          echo "このワークフローはPrivateのリポジトリ専用です。SettingsでPrivateに変更してください。"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 公告を収集
        run: python collect.py

      - name: ダウンロード用の一覧を作成
        run: python make_private_report.py

      - name: 非公開リポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/tenders.json docs/private-report.html
          if ! git diff --cached --quiet; then
            git commit -m "update private report $(date -u +%F)"
            git push
          fi

      - name: 一覧へのリンクを表示
        env:
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/docs/private-report.html
        run: |
          echo '## 一覧の保存が完了しました' >> "$GITHUB_STEP_SUMMARY"
          echo "[一覧ファイルを開く]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo 'ファイル画面右上の Download raw file（下向き矢印）で保存し、ブラウザで開いてください。' >> "$GITHUB_STEP_SUMMARY"
